[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-neural-search"
version = "0.1.0"
description = "Grover search and variational quantum circuits for 4-qubit EEG pattern classification, built with Qiskit and PennyLane."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Jeffrey Morais" },
]
keywords = ["quantum computing", "neuroscience", "EEG", "Grover", "VQC", "Qiskit", "PennyLane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24,<3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "pennylane>=0.35",
]

[project.optional-dependencies]
viz = [
    "netplotbrain>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["quantumNeuralSearch"]

[project.urls]
Repository = "https://github.com/IsolatedSingularity/Quantum-Neural-Search"
Author = "https://ichor.pages.dev/"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_functions = ["test_*", "test*"]
addopts = "-q --tb=short"
